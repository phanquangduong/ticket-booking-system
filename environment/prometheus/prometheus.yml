global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "ticketbookingsystem-prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:9090"]
    metrics_path: "/metrics"

  - job_name: "ticketbookingsystem-spring"
    scrape_interval: 5s
    static_configs:
      - targets: [ "host.docker.internal:1122" ]
    metrics_path: "/actuator/prometheus"

  - job_name: "ticketbookingsystem-node-exporter"
    scrape_interval: 5s
    static_configs:
      - targets: [ "host.docker.internal:9100" ]